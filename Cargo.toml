[package]
name = "tauri-plugin-network-interfaces"
version = "0.1.0"
authors = ["Dash Chat"]
description = "Holds a WiFi multicast lock on Android so inbound mDNS reaches the app, for LAN-only p2p discovery."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-network-interfaces"

[dependencies]
tauri = { version = "2.9.2" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }
